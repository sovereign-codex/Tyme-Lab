      - index
      - retrieve
      - compare_provenance
      - prepare_archive_candidate
      - emit_evidence
    prohibited_actions:
      - promote_canon
      - mutate_institutional_memory_without_authorization
      - rewrite_source_history
      - authorize_execution
      - grant_authority
    authority_ceiling: archival_proposal
    runtime_preference: avot-engine
    return_contract: EVIDENCE_RETURN_v0.1

  - avot_id: avot-water
    name: AVOT-Water
    lifecycle_state: defined_unrouted
    manifest_version: "legacy-manifest/1"
    role: "Flow and resilience analysis for water / adaptive-system domains."
    source_manifest: "AVOT-forge/AVOT-core/agents/avot-water.yaml"
    accepted_intents: []
    permitted_actions:
      - analyze_assigned_domain
      - model_flow
      - recommend
      - emit_evidence
    prohibited_actions:
      - self_route
      - operate_physical_system
      - authorize_execution
      - mutate_infrastructure
      - grant_authority
    authority_ceiling: analysis_only
    runtime_preference: unassigned
    return_contract: EVIDENCE_RETURN_v0.1
    notes:
      - "Manifest exists but no legacy avot_registry.json routing entry was found."

  - avot_id: avot-mana
    name: AVOT-Mana
    lifecycle_state: defined_unrouted
    manifest_version: "legacy-manifest/1"
    role: "Resource allocation and capacity-planning analysis."
    source_manifest: "AVOT-forge/AVOT-core/agents/avot-mana.yaml"
    accepted_intents: []
    permitted_actions:
      - analyze_assigned_resources
      - forecast_capacity
      - recommend_allocation
      - emit_evidence
    prohibited_actions:
      - self_route
      - reallocate_live_resources
      - authorize_execution
      - mutate_infrastructure
      - grant_authority
    authority_ceiling: analysis_only
    runtime_preference: unassigned
    return_contract: EVIDENCE_RETURN_v0.1
    notes:
      - "Manifest exists but no legacy avot_registry.json routing entry was found."

  - avot_id: avot-energy
    name: AVOT-Energy
    lifecycle_state: defined_unrouted
    manifest_version: "legacy-manifest/1"
    role: "Energy / throughput analysis and reliability recommendations."
    source_manifest: "AVOT-forge/AVOT-core/agents/avot-energy.yaml"
    accepted_intents: []
    permitted_actions:
      - analyze_assigned_energy_domain
      - inspect_throughput_evidence
      - recommend
      - emit_evidence
    prohibited_actions:
      - self_route
      - enforce_live_throughput_policy
      - remediate_live_infrastructure
      - authorize_execution
      - grant_authority
    authority_ceiling: analysis_only
    runtime_preference: unassigned
    return_contract: EVIDENCE_RETURN_v0.1
    notes:
      - "Manifest exists but no legacy avot_registry.json routing entry was found."

routing_policy:
  principle: "Routing resolves Work intent to eligible participant identities; routing never grants capability authority."
  existing_routed_avots:
    - avot-convergence
    - avot-quill
    - avot-tyme
    - avot-harmonia
    - avot-initiate
    - avot-guardian
    - avot-fabricator
    - avot-archivist
  unrouted_avots:
    - avot-water
    - avot-mana
    - avot-energy

normalization_decisions:
  - id: AVOT-NORM-001
    decision: "Collapse duplicate legacy AVOT-Fabricator entries into one stable identity."
  - id: AVOT-NORM-002
    decision: "Do not equate manifest status: active with verified live runtime execution."
  - id: AVOT-NORM-003
    decision: "Treat Water, Mana, and Energy as defined_unrouted until a reviewed routing/activation record exists."
  - id: AVOT-NORM-004
    decision: "Reserve institutional orchestration authority for TYME / Control Center, not AVOT-Convergence or AVOT-Tyme."
  - id: AVOT-NORM-005
    decision: "Treat Guardian as advisory review; enforcement belongs to governed policy / Value Kernel gates."
  - id: AVOT-NORM-006
    decision: "Treat Fabricator repository writes as capability requests requiring separate authorization."
