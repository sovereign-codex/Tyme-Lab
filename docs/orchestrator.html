<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AVOT Orchestrator – Observer</title>
  <style>
    body {
      font-family: system-ui, -apple-system;
      background: #0b0b0b;
      color: #e6e6e6;
      padding: 16px;
    }
    .event {
      border-left: 4px solid #444;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #151515;
    }
    .sev-1 { border-color: #3fb950; }
    .sev-2 { border-color: #58a6ff; }
    .sev-3 { border-color: #d29922; }
    .sev-4 { border-color: #f85149; }
    .sev-5 { border-color: #ff0000; }
    .type {
      font-weight: 600;
      font-size: 14px;
    }
    .summary {
      font-size: 13px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

<h2>AVOT Orchestrator – Field Events</h2>
<div id="events"></div>

<script>
  // TEMPORARY MOCK FEED
  // (until wired to real SSE / API)
  const eventsEl = document.getElementById("events");

  function addEvent(e) {
    const div = document.createElement("div");
    div.className = `event sev-${e.severity}`;
    div.innerHTML = `
      <div class="type">${e.type}</div>
      <div class="summary">${e.summary}</div>
    `;
    eventsEl.prepend(div);
  }

  // Simulate orchestrator output (proves UI + mental model)
  setInterval(() => {
    addEvent({
      type: "field:stable",
      severity: 1,
      summary: "Field stable (synthetic heartbeat)"
    });
  }, 1500);
</script>

</body>
</html>
