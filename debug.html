<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tyme Debug Console — Phase Four</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1115;
      color: #e6e6eb;
      margin: 0;
      padding: 1rem;
    }

    h1, h2 {
      margin: 0.5rem 0;
    }

    button {
      background: #1e2230;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin: 0.25rem 0.25rem 0.25rem 0;
      cursor: pointer;
    }

    button:active {
      background: #2a2f44;
    }

    .panel {
      border: 1px solid #2a2f44;
      border-radius: 8px;
      padding: 0.75rem;
      margin: 1rem 0;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b0d12;
      padding: 0.5rem;
      border-radius: 6px;
      margin-top: 0.5rem;
    }

    .ok { color: #6ddf8a; }
    .warn { color: #f2c94c; }
    .bad { color: #eb5757; }

    .group {
      padding: 0.5rem;
      border-bottom: 1px solid #2a2f44;
    }

    .group:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <h1>🧭 Tyme Debug Console</h1>
  <div class="mono">
    Phase Four — Multi-Agent Consensus & Policy
  </div>

  <!-- Controls -->
  <div class="panel">
    <h2>Controls</h2>
    <button onclick="refresh()">🔄 Refresh Snapshot</button>
    <button onclick="runPhase4()">🧠 Run Phase 4 (All Groups)</button>
    <button onclick="exportLedger()">📦 Export Ledger Snapshot</button>
  </div>

  <!-- System Status -->
  <div class="panel">
    <h2>System Status</h2>
    <div id="status" class="mono">Loading…</div>
  </div>

  <!-- Groups -->
  <div class="panel">
    <h2>Groups</h2>
    <div id="groups"></div>
  </div>

  <!-- Raw Output -->
  <div class="panel">
    <h2>Raw Output (Selected)</h2>
    <div id="raw" class="mono">Select a group.</div>
  </div>

<script type="module">
  import { runPhaseFourForAllGroups } from "./tyme/phase4Orchestrator.js";

  let lastSnapshot = null;

  function $(id) {
    return document.getElementById(id);
  }

  function safe(fn) {
    try { return fn(); }
    catch (e) { return { error: String(e) }; }
  }

  function refresh() {
    const ledger = safe(() => window.__TYME_LEDGER__?.());
    const meta = safe(() => window.__TYME_META__?.());
    const groups = safe(() => window.__TYME_GROUPS__?.());

    lastSnapshot = { ledger, meta, groups };

    $("status").textContent = JSON.stringify(
      {
        probes: ledger?.length ?? 0,
        groups: groups?.length ?? 0,
        meta_status: meta?.stability_rating ?? "—"
      },
      null,
      2
    );

    renderGroups(groups || []);
  }

  function renderGroups(groups) {
    if (!groups.length) {
      $("groups").innerHTML = "<div class='mono'>No groups found.</div>";
      return;
    }

    $("groups").innerHTML = groups.map(g => {
      const cls =
        g.has_policy
          ? "ok"
          : g.has_consensus
          ? "warn"
          : "bad";

      return `
        <div class="group ${cls}">
          <strong>${g.group_id}</strong><br/>
          Probes: ${g.probe_count}<br/>
          Consensus: ${g.has_consensus}<br/>
          Policy: ${g.has_policy}<br/>
          <button onclick="inspectGroup('${g.group_id}')">Inspect</button>
        </div>
      `;
    }).join("");
  }

  window.inspectGroup = function (group_id) {
    const group = safe(() => window.__TYME_GROUP__?.(group_id));
    $("raw").textContent = JSON.stringify(group, null, 2);
  };

  function runPhase4() {
    const ledgerObj = safe(() => window.__TYME_LEDGER_OBJ__?.());
    if (!ledgerObj) {
      alert("Ledger object hook not available.");
      return;
    }

    const results = runPhaseFourForAllGroups(ledgerObj);
    refresh();
    alert(`Phase Four complete for ${results.length} group(s).`);
  }

  function exportLedger() {
    const snap = safe(() => window.__TYME_LEDGER_OBJ__?.().exportSnapshot());
    if (!snap) {
      alert("Unable to export ledger.");
      return;
    }

    const blob = new Blob([JSON.stringify(snap, null, 2)], {
      type: "application/json"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tyme-ledger-snapshot.json";
    a.click();
  }

  // Initial load
  refresh();
</script>

</body>
</html>
