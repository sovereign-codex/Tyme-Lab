purpose: >-
  Reconstruct the Living Kodex lineage without assuming that a single static
  historical body existed, and without treating later runtime or governance
  implementations as the missing source scroll.

evidence_classes:
  historical_shell:
    description: Early repository surfaces that establish title, ordering, or purpose but do not contain a full body.
  historical_snapshot:
    description: Bounded backup or repository evidence preserving contemporaneous role language.
  implementation_or_interpretation:
    description: Later software, UI, or workflow that implements or interprets Living Kodex concepts without proving original source text.
  later_governance_codification:
    description: Later institutional registry or governance state that defines current system relationships but cannot retroactively establish the original body.
  current_registry_state:
    description: Present Office/Notion classification and review state.

