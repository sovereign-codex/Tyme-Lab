name: TYME Cognition Pilot 02 Tests

on:
  pull_request:
    paths:
      - "schemas/tyme-work-surface-orientation.v0.schema.json"
      - "schemas/tyme-attention-orientation.v0.schema.json"
      - "schemas/coherence-event.v0.schema.json"
      - "validators/tyme_work_surface_orientation_v0.py"
      - "fixtures/tyme_work_surface_orientation_v0/**"
      - "tests/test_tyme_work_surface_orientation_v0.py"
      - ".github/workflows/tyme-cognition-02-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-work-surface-orientation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install pytest jsonschema
      - name: Run Pilot 02 validation tests
        run: python -m pytest -q tests/test_tyme_work_surface_orientation_v0.py
