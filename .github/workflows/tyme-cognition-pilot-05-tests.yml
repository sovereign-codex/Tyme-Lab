name: TYME Cognition Pilot 05 Tests

on:
  pull_request:
    paths:
      - 'adapters/tyme_orientation_projection_v0.py'
      - 'validators/tyme_orientation_projection_v0.py'
      - 'schemas/tyme-orientation-projection.v0.schema.json'
      - 'tests/test_tyme_orientation_projection_v0.py'
      - 'docs/architecture/TYME_COGNITION_PILOT_05.md'
      - '.github/workflows/tyme-cognition-pilot-05-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-truthful-multiview-projection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Run Pilot 05 tests
        run: python -m pytest -q tests/test_tyme_orientation_projection_v0.py
