name: Participant Activation v0 tests

on:
  pull_request:
    paths:
      - 'docs/architecture/PARTICIPANT_ACTIVATION_V0.md'
      - 'governance/authorized-participant-activation-scopes.v0.json'
      - 'schemas/participant-activation.v0.schema.json'
      - 'schemas/participant-evidence.v0.schema.json'
      - 'schemas/runtime-evidence.v0.schema.json'
      - 'scripts/participant_activation_v0.py'
      - 'scripts/validate_participant_activation_inputs_v0.py'
      - 'scripts/validate_participant_activation_record_v0.py'
      - 'tests/test_participant_activation_v0.py'
      - '.github/workflows/participant-activation-v0-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Participant Activation v0 tests
        run: python -m pytest -q tests/test_participant_activation_v0.py
