name: TYME Governance Run

on:
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run Governance Engine
        run: |
          python scripts/MODEV_SUITE_RUNNER_V2_1

      - name: Commit State Updates
        run: |
          git config user.name "tyme-governance-bot"
          git config user.email "tyme@users.noreply.github.com"
          git add docs/state/
          git commit -m "TYME: Governance cycle run"
          git push