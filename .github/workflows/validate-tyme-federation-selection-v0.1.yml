name: Validate TYME Federation Selection v0.1

on:
  pull_request:
    paths:
      - "institutional-cognition/tyme-federation-selection/v0.1/**"
      - ".github/workflows/validate-tyme-federation-selection-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-selection-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate deterministic federation-selection fixture
        run: node institutional-cognition/tyme-federation-selection/v0.1/validate_fixture.mjs
