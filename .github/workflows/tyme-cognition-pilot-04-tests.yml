name: TYME Cognition Pilot 04 Tests

on:
  pull_request:
    paths:
      - 'adapters/tyme_inherited_capability_orientation_v0.py'
      - 'validators/tyme_inherited_capability_orientation_v0.py'
      - 'schemas/tyme-inherited-capability-orientation.v0.schema.json'
      - 'tests/fixtures/tyme_pilot04_pr26_merge_event.v0.json'
      - 'tests/test_tyme_inherited_capability_orientation_v0.py'
      - 'docs/architecture/TYME_COGNITION_PILOT_04.md'
      - '.github/workflows/tyme-cognition-pilot-04-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-inherited-capability-orientation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Run Pilot 04 tests
        run: python -m pytest -q tests/test_tyme_inherited_capability_orientation_v0.py
