name: Mobile Event Relay

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: "Institutional event type"
        required: true
        default: "shepherd.intent"
      target_surface:
        description: "office | hall | repository | lab | canon_review | runtime"
        required: true
        default: "office"
      target_ref:
        description: "Target repository, work item, office surface, or other stable reference"
        required: true
      classification:
        description: "REQUEST | PROPOSAL | REVIEW | RESEARCH | PRESERVATION | SYNCHRONIZATION | OBSERVATION"
        required: true
        default: "REQUEST"
      requested_disposition:
        description: "OBSERVE_ONLY | INSTITUTIONAL_INTAKE | ATTACH_TO_WORK | REQUIRES_REVIEW | PRESERVE | ROUTE_ONLY"
        required: true
        default: "INSTITUTIONAL_INTAKE"
      summary:
        description: "Short human intent; do not place secrets here"
        required: true
      primary_route:
        description: "Primary institutional route"
        required: true
        default: "notion_bridge"
      human_review_required:
        description: "Require human review downstream"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-event-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create pending Institutional Event Envelope
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          TARGET_SURFACE: ${{ inputs.target_surface }}
          TARGET_REF: ${{ inputs.target_ref }}
          CLASSIFICATION: ${{ inputs.classification }}
          REQUESTED_DISPOSITION: ${{ inputs.requested_disposition }}
          SUMMARY: ${{ inputs.summary }}
          PRIMARY_ROUTE: ${{ inputs.primary_route }}
          HUMAN_REVIEW_REQUIRED: ${{ inputs.human_review_required }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone

          allowed_surface = {"office","hall","repository","lab","canon_review","runtime"}
          allowed_class = {"OBSERVATION","REQUEST","PROPOSAL","REVIEW","RESEARCH","PRESERVATION","SYNCHRONIZATION","OTHER"}
          allowed_disposition = {"OBSERVE_ONLY","INSTITUTIONAL_INTAKE","ATTACH_TO_WORK","REQUIRES_REVIEW","PRESERVE","ROUTE_ONLY"}

          surface = os.environ["TARGET_SURFACE"]
          classification = os.environ["CLASSIFICATION"]
          disposition = os.environ["REQUESTED_DISPOSITION"]
          if surface not in allowed_surface: raise SystemExit(f"invalid target_surface: {surface}")
          if classification not in allowed_class: raise SystemExit(f"invalid classification: {classification}")
          if disposition not in allowed_disposition: raise SystemExit(f"invalid requested_disposition: {disposition}")

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          run_id = os.environ["GITHUB_RUN_ID"]
          event_id = f"gh-{run_id}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          envelope = {
            "event_id": event_id,
            "event_version": "0.1",
            "event_type": os.environ["EVENT_TYPE"],
            "occurred_at": now,
            "received_at": now,
            "source": {
              "surface": "github",
              "ref": f"github-actions:{os.environ['GITHUB_WORKFLOW']}:{run_id}",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "context_ref": f"run:{run_id}"
            },
            "actor": {
              "actor_id": os.environ["GITHUB_ACTOR"],
              "actor_class": "human",
              "provider": "github",
              "implementation_ref": None
            },
            "target": {"surface": surface, "refs": [os.environ["TARGET_REF"]]},
            "intent": {
              "classification": classification,
              "summary": os.environ["SUMMARY"],
              "requested_disposition": disposition
            },
            "provenance": {
              "evidence_refs": [f"github-run:{run_id}"],
              "artifact_refs": [],
              "lineage_refs": []
            },
            "governance": {
              "authority_effect": "none",
              "mutation_allowed": False,
              "human_review_required": os.environ["HUMAN_REVIEW_REQUIRED"].lower() == "true",
              "authority_ref": None
            },
            "routing": {"primary": os.environ["PRIMARY_ROUTE"], "observers": ["avot_archivist"]},
            "state": "pending",
            "work_ref": None,
            "admission_ref": None,
            "notes": "Created by Mobile Event Relay v0. Event transport conveys no institutional authority."
          }
          out = pathlib.Path("institutional-events/pending")
          out.mkdir(parents=True, exist_ok=True)
          path = out / f"{event_id}.json"
          path.write_text(json.dumps(envelope, indent=2) + "\n")
          print(path)
          PY

      - name: Commit envelope
        run: |
          git config user.name "tyme-mobile-relay[bot]"
          git config user.email "tyme-mobile-relay[bot]@users.noreply.github.com"
          git add institutional-events/pending
          git diff --cached --quiet && exit 0
          git commit -m "event: ingest mobile institutional envelope"
          git push
