name: Mobile Event Relay

on:
  workflow_dispatch:
    inputs:
      intent:
        description: "Intent: OBSERVE | REQUEST | PROPOSE | REVIEW | RESEARCH | PRESERVE | SYNC"
        required: true
        default: "OBSERVE"
      target:
        description: "Target: office, repo/work reference, or stable identifier"
        required: true
        default: "office"
      message:
        description: "Message: short human intent; do not place secrets here"
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-event-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create pending Institutional Event Envelope
        env:
          MOBILE_INTENT: ${{ inputs.intent }}
          MOBILE_TARGET: ${{ inputs.target }}
          MOBILE_MESSAGE: ${{ inputs.message }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone

          intent_map = {
            "OBSERVE": ("OBSERVATION", "OBSERVE_ONLY"),
            "REQUEST": ("REQUEST", "INSTITUTIONAL_INTAKE"),
            "PROPOSE": ("PROPOSAL", "REQUIRES_REVIEW"),
            "REVIEW": ("REVIEW", "REQUIRES_REVIEW"),
            "RESEARCH": ("RESEARCH", "INSTITUTIONAL_INTAKE"),
            "PRESERVE": ("PRESERVATION", "PRESERVE"),
            "SYNC": ("SYNCHRONIZATION", "ROUTE_ONLY"),
          }
          allowed_surface = {"office","hall","repository","lab","canon_review","runtime"}

          mobile_intent = os.environ["MOBILE_INTENT"].strip().upper()
          target = os.environ["MOBILE_TARGET"].strip()
          message = os.environ["MOBILE_MESSAGE"].strip()
          if mobile_intent not in intent_map:
              raise SystemExit(f"invalid intent: {mobile_intent}")
          if not target:
              raise SystemExit("target must not be empty")
          if not message:
              raise SystemExit("message must not be empty")

          classification, disposition = intent_map[mobile_intent]
          surface = target.lower() if target.lower() in allowed_surface else "office"
          human_review = disposition == "REQUIRES_REVIEW"

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          run_id = os.environ["GITHUB_RUN_ID"]
          event_id = f"gh-{run_id}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          envelope = {
            "event_id": event_id,
            "event_version": "0.1",
            "event_type": "shepherd.intent",
            "occurred_at": now,
            "received_at": now,
            "source": {
              "surface": "github",
              "ref": f"github-actions:{os.environ['GITHUB_WORKFLOW']}:{run_id}",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "context_ref": f"run:{run_id}"
            },
            "actor": {
              "actor_id": os.environ["GITHUB_ACTOR"],
              "actor_class": "human",
              "provider": "github",
              "implementation_ref": None
            },
            "target": {"surface": surface, "refs": [target]},
            "intent": {
              "classification": classification,
              "summary": message,
              "requested_disposition": disposition
            },
            "provenance": {
              "evidence_refs": [f"github-run:{run_id}"],
              "artifact_refs": [],
              "lineage_refs": []
            },
            "governance": {
              "authority_effect": "none",
              "mutation_allowed": False,
              "human_review_required": human_review,
              "authority_ref": None
            },
            "routing": {"primary": "notion_bridge", "observers": ["avot_archivist"]},
            "state": "pending",
            "work_ref": None,
            "admission_ref": None,
            "notes": "Created by Mobile Event Relay v0.1. Event transport conveys no institutional authority."
          }
          out = pathlib.Path("institutional-events/pending")
          out.mkdir(parents=True, exist_ok=True)
          path = out / f"{event_id}.json"
          path.write_text(json.dumps(envelope, indent=2) + "\n")
          print(path)
          PY

      - name: Commit envelope
        run: |
          git config user.name "tyme-mobile-relay[bot]"
          git config user.email "tyme-mobile-relay[bot]@users.noreply.github.com"
          git add institutional-events/pending
          git diff --cached --quiet && exit 0
          git commit -m "event: ingest mobile institutional envelope"
          git push
