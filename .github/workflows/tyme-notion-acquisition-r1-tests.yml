name: TYME Notion Acquisition R1 Tests

on:
  pull_request:
    paths:
      - 'adapters/**'
      - 'validators/tyme_work_surface_orientation_v0.py'
      - 'schemas/**'
      - 'tests/test_tyme_*'
      - 'fixtures/**'
      - 'institutional-returns/gates/**'
      - 'docs/architecture/**'
      - '.github/workflows/tyme-notion-acquisition-r1-tests.yml'

permissions:
  contents: read

jobs:
  validate-acquisition-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inherited test dependencies
        run: python -m pip install pytest jsonschema
      - name: Record exact checkout and environment
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze
      - name: Run R1 synthetic acquisition and offline replay tests
        run: python -m pytest -q tests/test_tyme_notion_live_read_v0.py tests/test_tyme_institutional_discovery_snapshot_v0.py
      - name: Run inherited Pilot 02 and Pilot 03 contracts
        run: python -m pytest -q tests/test_tyme_work_surface_orientation_v0.py tests/test_tyme_repository_snapshot_discovery_v0.py
      - name: Run inherited Pilot 03B tests
        run: >-
          python -m pytest -q
          tests/test_tyme_github_live_read_v0.py
          tests/test_tyme_github_snapshot_overview_v0.py
          tests/test_tyme_gate_resolution_probe_v0.py
          tests/test_tyme_gate_return_lookup_v0.py
          tests/test_tyme_snapshot_temporal_view_v0.py
          tests/test_tyme_temporal_observability_integration_v0.py
          tests/test_tyme_github_snapshot_overview_integration_v0.py
