name: TYME Cognition Pilot 03 Tests

on:
  pull_request:
    paths:
      - "docs/architecture/TYME_COGNITION_PILOT_03.md"
      - "fixtures/tyme_discovery_v0/**"
      - "adapters/tyme_repository_snapshot_discovery_v0.py"
      - "tests/test_tyme_repository_snapshot_discovery_v0.py"
      - "schemas/tyme-work-surface-orientation.v0.schema.json"
      - "validators/tyme_work_surface_orientation_v0.py"
      - ".github/workflows/tyme-cognition-03-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-read-only-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install pytest jsonschema
      - name: Run Pilot 02 inherited contract tests
        run: python -m pytest -q tests/test_tyme_work_surface_orientation_v0.py
      - name: Run Pilot 03 deterministic discovery tests
        run: python -m pytest -q tests/test_tyme_repository_snapshot_discovery_v0.py
